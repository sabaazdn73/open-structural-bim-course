name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ./checker pytest pypdf markdown-it-py==4.2.0
      - run: python tools/build_brief.py
      - run: python tools/build_datasets.py
      - run: python tools/build_lessons.py
      - run: python tools/build_web.py
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: python -m pytest -q tests
      - run: git diff --exit-code course brief tests/fixtures web/data
  browser-checker-version:
    # The practice panel runs the checker with the IfcOpenShell 0.8.5 WebAssembly build: test that version too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./checker "ifcopenshell==0.8.5" pytest "pypdf==7.0.0"
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: python -m pytest -q tests
